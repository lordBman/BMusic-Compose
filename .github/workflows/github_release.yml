name: Build & Release APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # -----------------------------------------
      # VERSION
      # -----------------------------------------

      - name: Determine Version
        id: version
        shell: bash
        run: |
          # ==========================================
          # CHANGE THESE WHEN STARTING A NEW VERSION
          # ==========================================

          MAJOR=1
          MINOR=0

          # ==========================================
          # Find latest tag for this major.minor
          # ==========================================

          LATEST_TAG=$(git tag -l "v${MAJOR}.${MINOR}.*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            PATCH=0
          else
            PATCH=$(echo "$LATEST_TAG" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+)$/\1/')
            PATCH=$((PATCH + 1))
          fi

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"

          # ==========================================
          # Android versionCode
          #
          # GitHub run_number always increases.
          # Add 100 so our first release starts
          # at 101 instead of 1.
          # ==========================================

          VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))

          echo "Version: $VERSION"
          echo "Tag: $TAG"
          echo "Version Code: $VERSION_CODE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      # -----------------------------------------
      # CREATE GIT TAG
      # -----------------------------------------
      - name: Create Git Tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"

      # -----------------------------------------
      # Build Release APK
      # -----------------------------------------
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ steps.version.outputs.version_code }}

      # -----------------------------------------
      # Sign APK
      # -----------------------------------------
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          # override default build-tools version (32.0.0) -- optional
          BUILD_TOOLS_VERSION: "34.0.0"

      # ==========================================
      # RENAME ARTIFACTS
      # ==========================================
      - name: Prepare Release Files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          cp ${{steps.sign_app.outputs.signedReleaseFile}} "release/bmusic-${VERSION}-android.apk"
          echo "Release files:"
          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: "release/bmusic-${{ steps.version.outputs.version }}-android.apk"
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
